<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-text-color); }
        .btn { background: #3390ec; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
    </style>
</head>
<body>
    <h3>⚙️ Параметри пошуку</h3>
    
    <div class="input-group">
        <label>Марка авто:</label>
        <select id="brand" onchange="updateModels()">
            <option value="all">Усі марки</option>
        </select>
    </div>

    <div class="input-group">
        <label>Модель:</label>
        <select id="model" disabled>
            <option value="">Спочатку оберіть марку</option>
        </select>
    </div>

    <div class="row">
        <div class="input-group">
            <label>Ціна до (Kč):</label>
            <input type="number" id="max_price" placeholder="напр. 200000">
        </div>
        <div class="input-group">
            <label>Рік від:</label>
            <input type="number" id="min_year" placeholder="2015">
        </div>
    </div>

    <div class="input-group">
        <label>Пробіг до (км):</label>
        <input type="number" id="max_mileage" placeholder="напр. 150000">
    </div>

    <div class="input-group">
        <label>⏱ Тривалість пошуку:</label>
        <select id="duration">
            <option value="12">12 годин</option>
            <option value="24" selected>24 години</option>
            <option value="48">48 годин</option>
        </select>
    </div>

    <button class="btn" onclick="sendData()">🚀 Запустити моніторинг</button>

        const brandSelect = document.getElementById('brand');
        const modelSelect = document.getElementById('model');

        // Наповнення марок
        carData.cars.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.brand;
            opt.textContent = item.brand;
            brandSelect.appendChild(opt);
        });

        function updateModels() {
            const selectedBrand = brandSelect.value;
            modelSelect.innerHTML = '<option value="">Усі моделі</option>';
            
            if (selectedBrand === 'all') {
                modelSelect.disabled = true;
            } else {
                modelSelect.disabled = false;
                const brandObj = carData.cars.find(c => c.brand === selectedBrand);
                if (brandObj) {
                    brandObj.models.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m;
                        opt.textContent = m;
                        modelSelect.appendChild(opt);
                    });
                }
            }
        }

        function sendData() {
            const data = {
                brand: brandSelect.value,
                model: modelSelect.value,
                max_price: document.getElementById('max_price').value,
                min_year: document.getElementById('min_year').value,
                max_mileage: document.getElementById('max_mileage').value,
                duration: document.getElementById('duration').value
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
